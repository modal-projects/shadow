[project]
name = "shadow-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
    "modal>=1.6,<2",
]

[dependency-groups]
bench = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "python-fcl==0.7.0.11",
    "trimesh==5.1.1",
    "wsproto>=1.3,<2",
    "filelock>=3,<4",
    "openai>=2,<3",
]

[tool.uv]
package = false
